<script type="text/html" id="tmplTvModal">
    <div class="modal fade portfolio-modal modal-fullscreen-xl" tabindex="-1" role="dialog"
         aria-labelledby="portfolioModal"
         aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-body">
                    <div class="container">
                        <div class="row justify-content-center">
                            <div class="col-12 back pb-3">
                                <a href="#" data-dismiss="modal" aria-label="Close">&lsaquo;&nbsp;Back</a>
                            </div>
                            {{#video_id}}
                            <div class="col-10 modal-video-player">
                                <div class="loading-wrapper">
                                    <div class="spinner-border text-light" role="status">
                                        <span class="sr-only">Loading...</span>
                                    </div>
                                </div>
                            </div>
                            {{/video_id}}
                            {{^video_id}}
                            {{#image}}
                            <div class="col-10">
                                <img src="{{image.src}}" srcset="{{image.srcset}}" sizes="{{image.sizes}}"
                                     alt="{{title}}"/>
                            </div>
                            {{/image}}
                            {{/video_id}}
                            <div class="col-8 text-center grid-item-content">
                                <div class="grid-item-title">{{title}}</div>
                                <div class="grid-item-subtitle">{{days}}</div>
                                <div class="grid-item-subsubtitle">{{airing}}</div>
                                <p class="grid-item-description py-3">{{description}}</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</script>
