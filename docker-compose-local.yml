services:
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: rsm_php
    environment:
      WORDPRESS_DB_HOST: host.docker.internal:3306
      WORDPRESS_DB_NAME: rogerssportsandmedia
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./webroot:/var/www/html/webroot
      - ./config:/var/www/html/config
    networks:
      - rsm_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: rsm_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./webroot:/var/www/html/webroot:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    environment:
      - DOMAIN=local-www.rogerssportsandmedia.com
    networks:
      - rsm_network
    depends_on:
      - php
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rsm_redis
    ports:
      - "6379:6379"
    command: redis-server --stop-writes-on-bgsave-error no
    networks:
      - rsm_network
    restart: unless-stopped
    volumes:
      - redis_data:/data

networks:
  rsm_network:
    driver: bridge

volumes:
  redis_data:
